<!DOCTYPE html>
<html>
<head>
    <title>5G Network Slicing Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
        }
        button:hover {
            background-color: #0056b3;
        }
        #roleDisplay {
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h2>5G Wireless Network Slicing Dashboard</h2>

<h3 id="roleDisplay"></h3>
<h3 id="sliceDisplay"></h3>

<br>

<button onclick="goNetwork()">Network Simulation</button>
<button onclick="goOptimize()">Power Optimization</button>
<button onclick="logout()">Logout</button>

<script>

// Display Role
document.getElementById("roleDisplay").innerText =
    "Logged in Role: " + localStorage.getItem("role");

// Display Assigned Network Slice
document.getElementById("sliceDisplay").innerText =
    "Assigned Network Slice: " + localStorage.getItem("slice");


// Navigate Pages
function goNetwork(){
    window.location.href = "network.html";
}

function goOptimize(){
    window.location.href = "optimize.html";
}

// Logout
function logout(){
    localStorage.clear();
    window.location.href = "login.html";
}

</script>

</body>
</html>
